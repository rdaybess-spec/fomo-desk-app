<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FOMO Desk">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>FOMO Desk</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --line: rgba(255, 255, 255, 0.08);
      --green: #30d158;
      --red: #ff453a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(48, 209, 88, 0.85); }
    .dot.bad { background: var(--red); box-shadow: 0 0 8px rgba(255, 69, 58, 0.75); }

    .gate {
      margin: 26vh auto 0;
      max-width: 18em;
      text-align: center;
      text-wrap: balance;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: -0.02em;
    }

    .card {
      margin-top: 22px;
      padding: 22px 20px 20px;
      background: var(--card);
      border-radius: 22px;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .cash {
      margin: 8px 0 0;
      font-size: clamp(42px, 13vw, 64px);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-align: right;
      width: 100%;
    }

    .mode {
      display: inline-block;
      margin: 14px 0 0;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .mode.paper { background: #2c2c2e; color: #f2f2f7; }
    .mode.live { background: rgba(48, 209, 88, 0.16); color: var(--green); }

    .screen { margin-top: 26px; }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .shot {
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      border: 1px solid var(--line);
    }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .shot-time {
      display: flex;
      gap: 6px;
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .facts {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
    }

    .facts li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 13px 16px;
      border-top: 1px solid var(--line);
    }

    .facts li:first-child { border-top: 0; }

    .facts .k {
      color: var(--muted);
      font-size: 15px;
      flex: 0 1 auto;
    }

    .facts .v {
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      direction: ltr;
      unicode-bidi: isolate;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1 1 auto;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <h1>FOMO Desk</h1>
      <p class="status" id="status" hidden>
        <span class="dot" id="dot"></span>
        <span>آخر تحديث</span>
        <time id="status-time" dir="ltr"></time>
      </p>
    </header>
    <p class="gate" id="gate" hidden></p>
    <div id="desk" hidden>
      <section class="card" aria-label="الرصيد">
        <p class="eyebrow">الرصيد</p>
        <p class="cash" id="cash" dir="ltr"></p>
        <p class="mode paper" id="mode" dir="ltr">PAPER</p>
      </section>
      <section class="screen" id="screen-section" hidden>
        <h2>الشاشة المباشرة</h2>
        <div class="shot">
          <img id="screen" alt="الشاشة المباشرة">
        </div>
        <p class="shot-time" id="screen-time-row" hidden>
          <span>آخر تحديث</span>
          <time id="screen-time" dir="ltr"></time>
        </p>
      </section>
      <ul class="facts" id="extras" hidden></ul>
    </div>
  </div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
